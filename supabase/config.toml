# usmfomo — Supabase CLI configuration.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# SECURITY BASELINE: scripts/check-config.py fails CI if the auth/api/storage
# values below drift. `supabase config push` is run BY HAND only, after
# `pnpm supabase config diff` (never from CI) — see docs/runbooks/deploy.md.
project_id = "usmfomo"

[api]
enabled = true
port = 54321
# Only `public` is exposed to the Data API; `private` and `audit` never are.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Hard cap on rows per request, set-returning RPCs included (a cut reply is
# still a 200). Every list in the app pages below it; admin and maintenance
# lists that can grow past it return one jsonb value (0051).
max_rows = 100
# New tables need explicit GRANTs (same as new hosted projects).
auto_expose_new_tables = false

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17
orioledb_version = ""

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# Local and CI only (`db push` never runs seeds): sample orgs/posts + pgTAP helpers.
enabled = true
sql_paths = ["./seed.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
# Not used: the free plan caps Realtime at 200 connections; lists refetch instead.
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

# Mailpit catches any email the local stack tries to send. usmfomo never sends
# email, so anything that shows up here is a bug.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
# Global cap; the posters bucket (created in a migration) is capped at 2 MiB.
file_size_limit = "2MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

[storage.vector]
enabled = false
max_buckets = 10
max_indexes = 5

[auth]
enabled = true
# No email or OAuth redirects are used (password login only).
site_url = "https://usmfomo.pages.dev"
additional_redirect_urls = []
jwt_expiry = 1800
# Local dev signs with ES256 like production. Generate once (git-ignored):
#   pnpm supabase gen signing-key --algorithm ES256
signing_keys_path = "./signing_keys.json"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# GLOBAL sign-up switch: nobody can create an account through the API.
# Accounts are created only by the owner (owner console / scripts/account.ts).
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
# Default kept on purpose: campus Wi-Fi puts many users behind one public IP.
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.captcha]
enabled = true
provider = "turnstile"
# Local/CI: the public always-pass test secret from supabase/.env.
# Production: set in the dashboard (Authentication > Bot and Abuse Protection).
secret = "env(TURNSTILE_SECRET)"

[auth.email]
# This is the EMAIL PROVIDER switch, not a sign-up switch. Password login needs
# it ON; sign-ups stay closed through [auth].enable_signup = false.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

# usmfomo never sends email (logins are usernames mapped to synthetic addresses).
[auth.email.notification.password_changed]
enabled = false

[auth.email.notification.email_changed]
enabled = false

[auth.email.notification.phone_changed]
enabled = false

[auth.email.notification.identity_linked]
enabled = false

[auth.email.notification.identity_unlinked]
enabled = false

[auth.email.notification.mfa_factor_enrolled]
enabled = false

[auth.email.notification.mfa_factor_unenrolled]
enabled = false

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.mfa]
max_enrolled_factors = 10

# TOTP is free: optional for club/school accounts, mandatory for the owner.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

[auth.web3.solana]
enabled = false

[auth.third_party.firebase]
enabled = false

[auth.third_party.auth0]
enabled = false

[auth.third_party.aws_cognito]
enabled = false

[auth.third_party.clerk]
enabled = false

[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# Local values come from supabase/.env; production secrets are set with
# `pnpm supabase secrets set` (docs/runbooks/deploy.md), never in this file.
[edge_runtime.secrets]
CRON_SECRET = "env(CRON_SECRET)"
ADMIN_ORIGINS = "env(ADMIN_ORIGINS)"

# Both functions authorise in code (new API keys are not JWTs):
# maintenance checks x-cron-secret; owner-admin verifies an aal2 owner session.
[functions.maintenance]
verify_jwt = false

[functions.owner-admin]
verify_jwt = false

[analytics]
# Off to save RAM on this Mac (Studio's log explorer is then unavailable).
enabled = false
port = 54327
backend = "postgres"

[experimental.pgdelta]
enabled = true
