# usmfomo deploy: after CI succeeds on main, or by hand (Actions > Deploy > Run workflow on main).
#
#   gate    picks the commit: the one CI just passed, or main's HEAD for a manual run
#           (refused unless CI passed for it). Uses the Actions API only, no code.
#   build   no secrets and no environment: installs, builds both apps with the
#           production PUBLIC values (repository variables) and uploads artifacts.
#   deploy  environment "production": downloads the artifacts, installs the deploy
#           tools (the root package's Supabase CLI and wrangler) from the committed
#           lockfile in a step with no secrets, then runs them. No caches; secrets
#           only as step-level env of the steps that deploy, never while a package
#           installs or runs an install script.
#
# Supabase steps run only when the variable SUPABASE_PROJECT_ID is set, Cloudflare
# steps only when CLOUDFLARE_ACCOUNT_ID is set, so the pipeline grows by phase.
# `supabase config push` is NEVER run here: it is done by hand after
# `supabase config diff` (docs/runbooks/deploy.md). One-time setup: same runbook.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

# No workflow-level concurrency: every completed CI run on a branch named main
# starts this workflow, and one whose gate is skipped must not take the place of
# a deploy that is waiting. The deploy job holds the group instead.

jobs:
  gate:
    # workflow_run also fires for pull-request CI runs, including a fork's branch
    # named "main", so check the event, the branch AND the repository.
    if: >-
      vars.VITE_SUPABASE_URL != '' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Pick the commit to deploy
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = workflow_run ]; then
            sha="$RUN_SHA"
          else
            sha="$GITHUB_SHA"
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&branch=main&status=success&per_page=1" --jq '.total_count')
            if [ "${passed:-0}" -lt 1 ]; then
              echo "::error::CI has not passed for $sha on main. Wait for CI (it deploys by itself) or fix main first."
              exit 1
            fi
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::unexpected commit id '$sha'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache anywhere in the release path (cache-poisoning hygiene).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile

      # Repository variables (not environment ones: this job has no environment on purpose).
      - name: Check the production public values
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          fail=0
          if ! [[ "$VITE_SUPABASE_URL" =~ ^https://[a-z0-9-]+(\.[a-z0-9-]+)+$ ]]; then
            echo "::error::vars.VITE_SUPABASE_URL must look like https://<ref>.supabase.co (no path, no trailing slash)"
            fail=1
          fi
          if [[ "$VITE_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "::error::vars.VITE_SUPABASE_PUBLISHABLE_KEY must be the publishable key (sb_publishable_...). A secret key must never be a variable: rotate it if it was."
            fail=1
          fi
          if [[ -z "$VITE_TURNSTILE_SITE_KEY" || "$VITE_TURNSTILE_SITE_KEY" =~ ^[123]x0+[A-F]{2}$ ]]; then
            echo "::error::vars.VITE_TURNSTILE_SITE_KEY must be the production widget's site key, not empty and not a Turnstile test key"
            fail=1
          fi
          exit "$fail"

      - name: Build the public site (usmfomo)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_IMAGE_MODE: proxy
          VITE_CONTACT_URL: ${{ vars.VITE_CONTACT_URL }}
        run: pnpm --filter web run build
      - name: Build the owner console (usmfomo-admin)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: pnpm --filter admin run build
      - name: Pages output contract (CSP names the production project, no secret keys)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: python3 .github/scripts/check-pages-output.py --supabase-url "$VITE_SUPABASE_URL"

      # Layout inside the artifact: dist/ next to functions/ and edge/. wrangler
      # compiles the /i/* image-proxy Function from ./functions (which imports
      # ../../edge/image-proxy.ts) in the directory it runs from, so the deploy job
      # runs `pages deploy dist` from this folder. No package.json is shipped with
      # the site: wrangler comes from the deploy tools (the last artifact).
      - name: Upload the public site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: |
            apps/web/dist
            apps/web/functions
            apps/web/edge
            !apps/web/edge/**/*.test.ts
          include-hidden-files: true # dist/.well-known/security.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload the owner console
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin
          path: apps/admin/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      # Everything else the deploy job needs, in the repository's own layout.
      - name: Upload migrations, functions and the cron Worker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            .nvmrc
            supabase/config.toml
            supabase/migrations
            supabase/functions
            !supabase/functions/**/*_test.ts
            workers/cron/wrangler.jsonc
            workers/cron/src
            !workers/cron/src/**/*.test.ts
          include-hidden-files: true # .nvmrc
          if-no-files-found: error
          retention-days: 7
      # The deploy tools are the root package's devDependencies, installed in the
      # deploy job from these three files alone. They go in a folder of their own:
      # pnpm refuses a frozen install when a workspace folder such as workers/cron
      # exists without its package.json.
      - name: Upload the deploy tools' manifest and lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-tools
          path: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Deploys run one at a time, in the order their builds finish; a waiting one
    # may be replaced by a newer one, a running one is never cut short (no half
    # migration or upload). Runs whose gate is skipped never get this far.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://usmfomo.pages.dev
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Download migrations, functions and the cron Worker
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: .
      - name: Download the public site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: site/web
      - name: Download the owner console
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admin
          path: site/admin/dist
      - name: Download the deploy tools' manifest and lockfile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-tools
          path: deploy-tools
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: deploy-tools/package.json
      # wrangler needs Node 22+ and the Supabase CLI Node 20+; use the repo's Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The exact Supabase CLI and wrangler that CI ran, integrity-checked against
      # pnpm-lock.yaml; nothing is resolved here. Install scripts (only esbuild's
      # and workerd's may run: allowBuilds in pnpm-workspace.yaml) run in this
      # step, which has no secrets. The tokens reach only the deploy steps below.
      - name: Install the deploy tools from the lockfile (no secrets in this step)
        working-directory: deploy-tools
        run: |
          pnpm install --frozen-lockfile
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          node_modules/.bin/supabase --version
          node_modules/.bin/wrangler --version

      # ---- Supabase: migrations and Edge Functions -------------------------------
      - name: Link the production project
        if: vars.SUPABASE_PROJECT_ID != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          # The CLI refuses to load config.toml without the (git-ignored) signing-key
          # file; production signs its own JWTs, so an empty key list is enough.
          printf '[]' > supabase/signing_keys.json
          # link only talks to the Management API (no database password: CLI
          # 2.119.0 ignores it here) and records the IPv4 pooler that db push
          # uses. GitHub runners have no IPv6, so never add --skip-pooler.
          supabase link --project-ref "$PROJECT_ID"
      - name: Apply new migrations
        if: vars.SUPABASE_PROJECT_ID != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # --skip-vault: CI changes no project settings or secrets, only the schema.
        run: supabase db push --linked --skip-vault --yes
      - name: Deploy the Edge Functions
        if: vars.SUPABASE_PROJECT_ID != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        # verify_jwt = false comes from config.toml; --use-api bundles server-side (no Docker).
        run: supabase functions deploy maintenance owner-admin --project-ref "$PROJECT_ID" --use-api

      # ---- Cloudflare: Pages projects and the cron Worker ------------------------
      # wrangler reads CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID from its
      # environment; only these three steps get them.
      - name: Deploy the public site (Pages project usmfomo)
        if: vars.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: site/web # dist/ + functions/ + edge/ (see the build job)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: wrangler pages deploy dist --project-name=usmfomo --branch=main --commit-hash="$SHA" --commit-dirty=true
      - name: Deploy the owner console (Pages project usmfomo-admin)
        if: vars.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: site/admin # no functions/ here: the console has no Functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: wrangler pages deploy dist --project-name=usmfomo-admin --branch=main --commit-hash="$SHA" --commit-dirty=true
      - name: Deploy the cron Worker (usmfomo-cron)
        if: vars.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: workers/cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Public values of the same project the site uses, bound as plain-text vars
          # (they replace the local defaults in wrangler.jsonc). CRON_SECRET is a
          # Worker secret set by hand once (`wrangler secret put`), never from CI.
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          wrangler deploy --config wrangler.jsonc \
            --var "SUPABASE_URL:$SUPABASE_URL" \
            --var "SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY"

      - name: Summary
        if: always()
        env:
          SUPABASE_ON: ${{ vars.SUPABASE_PROJECT_ID != '' }}
          CLOUDFLARE_ON: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
          SHA: ${{ needs.gate.outputs.sha }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Deploy of \`$SHA\`: $STATUS"
            if [ "$SUPABASE_ON" = true ]; then echo "- Supabase: migrations + maintenance, owner-admin"; else echo "- Supabase: skipped (set the production variable SUPABASE_PROJECT_ID)"; fi
            if [ "$CLOUDFLARE_ON" = true ]; then echo "- Cloudflare: usmfomo, usmfomo-admin, usmfomo-cron"; else echo "- Cloudflare: skipped (set the production variable CLOUDFLARE_ACCOUNT_ID)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SUPABASE_ON" != true ]; then echo "::warning::Supabase steps skipped: SUPABASE_PROJECT_ID is not set in the production environment"; fi
          if [ "$CLOUDFLARE_ON" != true ]; then echo "::warning::Cloudflare steps skipped: CLOUDFLARE_ACCOUNT_ID is not set in the production environment"; fi
